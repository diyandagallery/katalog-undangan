<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katalog Diyanda Gallery</title>
<style>
:root{--bg:#faf7f5;--card:#fff;--text:#2b2326;--muted:#7a6f73;--accent:#b5476a;--line:#eadfe2;--chip:#f3ebee}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1719;--card:#2a2225;--text:#f3ecee;--muted:#b3a4a9;--accent:#e07a9a;--line:#3d3236;--chip:#352b2e}}
:root[data-theme="dark"]{--bg:#1d1719;--card:#2a2225;--text:#f3ecee;--muted:#b3a4a9;--accent:#e07a9a;--line:#3d3236;--chip:#352b2e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
header{padding:20px 16px 8px;text-align:center}
header h1{margin:0;font-size:22px;color:var(--accent)}
header p{margin:4px 0 0;color:var(--muted);font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:999px;font-size:14px;cursor:pointer}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tab:disabled{opacity:.5;cursor:default}
.toolbar{padding:0 16px 12px;display:flex;flex-direction:column;gap:10px}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:none;background:var(--chip);color:var(--text);padding:6px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.chip.active{background:var(--text);color:var(--bg)}
main{padding:0 16px 40px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.thumb{aspect-ratio:3/4;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;overflow:hidden;text-align:center}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.info{padding:10px 12px 12px}
.code{font-weight:600;font-size:15px}
.size{color:var(--muted);font-size:12px;margin-top:2px}
.price{margin-top:6px;font-weight:700;color:var(--accent);font-size:16px}
.spec{margin-top:6px;font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:15px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:0 16px 24px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.modal[hidden]{display:none}
.sheet{background:var(--card);color:var(--text);width:100%;max-width:520px;max-height:94vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;padding:14px 0 16px;overflow:hidden}
@media (min-width:720px){.modal{align-items:center}.sheet{border-radius:18px}}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;padding:0 16px;text-align:center}
.slide .img{aspect-ratio:3/4;max-height:58vh;margin:0 auto;width:auto;max-width:100%;background:var(--chip);border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.slide .img img{width:100%;height:100%;object-fit:cover;display:block}
.slide h2{margin:12px 0 2px;font-size:20px}
.slide .size{font-size:14px;color:var(--muted)}
.slide .price{font-size:20px;color:var(--accent);font-weight:700;margin-top:4px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px 0}
.nav button{border:1px solid var(--line);background:var(--card);color:var(--text);width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer}
.counter{font-size:13px;color:var(--muted)}
.wa{display:block;margin:12px 16px 0;text-align:center;background:#25d366;color:#fff;text-decoration:none;padding:12px;border-radius:12px;font-weight:600}
.close{display:block;margin:8px 16px 0;background:none;border:1px solid var(--line);color:var(--text);padding:10px;border-radius:12px;font-size:14px;cursor:pointer}
.desc{margin-top:8px;font-size:13px;color:var(--muted);white-space:pre-line}
.slide .spec{margin-top:6px;font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Diyanda Gallery</h1>
  <p>Katalog undangan</p>
</header>

<div class="tabs" id="cats">
  <button class="tab active" data-cat="blangko">Undangan Blangko</button>
  <button class="tab" data-cat="artpaper" disabled>Artpaper (segera)</button>
  <button class="tab" data-cat="custom" disabled>Custom (segera)</button>
</div>

<section class="toolbar">
  <input type="search" id="q" placeholder="Cari kode, misal RINDU 11">
  <div class="chips" id="brandChips"></div>
</section>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Tidak ada produk yang cocok.</div>
</main>

<footer>Harga dapat berubah sewaktu-waktu. Hubungi kami untuk pemesanan dan minimal order.</footer>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="track" id="track"></div>
    <div class="nav">
      <button id="prev" aria-label="Sebelumnya">&#8249;</button>
      <span class="counter" id="counter"></span>
      <button id="next" aria-label="Berikutnya">&#8250;</button>
    </div>
    <a class="wa" id="wa" target="_blank" rel="noopener">Tanya produk ini via WhatsApp</a>
    <button class="close" id="close">Tutup</button>
  </div>
</div>

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSr1_Vdm1ZavUbFubZzEedfcO9yDS_0IVqLURiw-YZq0JTR5dxd9Z4zp6JdKG7NVW43hz0VrayiwXrw/pub?gid=533428198&single=true&output=csv";

const fmt = n => Number(n) > 0 ? "Rp " + Number(n).toLocaleString("id-ID") : "Harga menyusul";

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let k = 0; k < text.length; k++) {
    const c = text[k];
    if (q) {
      if (c === '"') { if (text[k + 1] === '"') { cell += '"'; k++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cell); cell = ""; }
    else if (c === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else if (c !== "\r") cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function fromCSV(text) {
  const rows = parseCSV(text).filter(r => r.some(x => x.trim()));
  const head = rows.shift().map(h => h.trim().toLowerCase());
  const col = name => head.indexOf(name);
  const iKode = col("kode blangko"), iHarga = col("harga jual"), iUk = col("ukuran plastik"),
        iGbr = col("link gambar"), iMin = col("min order"), iDesc = col("deskripsi"),
        iBahan = col("bahan"), iTebal = col("ketebalan");
  const get = (r, i) => (i >= 0 && r[i] ? r[i].trim() : "");
  const items = [];
  for (const r of rows) {
    const kode = get(r, iKode);
    if (!kode) continue;
    const m = kode.match(/^(.*?)\s*(\d+)$/);
    items.push({
      kode,
      brand: m ? m[1].trim() : kode,
      harga: Number(get(r, iHarga).replace(/[^\d]/g, "")) || 0,
      ukuran: get(r, iUk),
      gambars: get(r, iGbr) ? [get(r, iGbr)] : [],
      min: get(r, iMin),
      deskripsi: get(r, iDesc),
      bahan: get(r, iBahan),
      ketebalan: get(r, iTebal)
    });
  }
  items.sort((a, b) => a.brand === b.brand
    ? a.kode.localeCompare(b.kode, "id", { numeric: true })
    : a.brand.localeCompare(b.brand, "id"));
  return { items, brands: [...new Set(items.map(i => i.brand))] };
}

async function loadData() {
  try {
    const res = await fetch(CSV_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const parsed = fromCSV(await res.text());
    if (parsed.items.length) DATA = parsed;
  } catch (e) {
    DATA = EMBED;   // fallback: data tertanam di HTML
  }
}

function specLine(i) {
  const parts = [];
  if (i.min) parts.push("Min order " + i.min + " pcs");
  if (i.bahan) parts.push("Bahan: " + i.bahan);
  if (i.ketebalan) parts.push("Ketebalan: " + i.ketebalan);
  return parts.join(" · ");
}

    const btn = document.createElement("button");
    btn.className = "chip" + (b === brand ? " active" : "");
    btn.textContent = b;
    btn.onclick = () => {
      brand = b;
      document.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === btn));
      render();
    };
    chips.appendChild(btn);
  });
}

document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  render();
});

function render() {
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  current = DATA.items.filter(i =>
    (brand === "Semua" || i.brand === brand) &&
    (!query || i.kode.toLowerCase().includes(query))
  );
  document.getElementById("empty").hidden = current.length > 0;
  current.forEach((i, idx) => {
    const card = document.createElement("article");
    card.className = "card";
    const thumb = i.gambars && i.gambars.length
      ? `<img src="${i.gambars[0]}" alt="${i.kode}" loading="lazy">`
      : `Gambar belum tersedia`;
    card.innerHTML = `
      <div class="thumb">${thumb}</div>
      <div class="info">
        <div class="code"></div>
        <div class="size"></div>
        <div class="price"></div>
        <div class="spec"></div>
      </div>`;
    card.querySelector(".code").textContent = i.kode;
    card.querySelector(".size").textContent = i.ukuran ? "Ukuran plastik: " + i.ukuran : "";
    card.querySelector(".price").textContent = fmt(i.harga);
    card.querySelector(".spec").textContent = specLine(i);
    card.onclick = () => openModal(idx);
    grid.appendChild(card);
  });
}

// ---- detail popup with swipe within one brand ----
const modal = document.getElementById("modal");
const track = document.getElementById("track");
const counter = document.getElementById("counter");
const wa = document.getElementById("wa");

function buildSlides() {
  track.innerHTML = "";
  deck.forEach(i => {
    const s = document.createElement("div");
    s.className = "slide";
    const img = i.gambars && i.gambars.length
      ? `<img src="${i.gambars[0]}" alt="${i.kode}">`
      : "Gambar belum tersedia";
    s.innerHTML = `
      <div class="img">${img}</div>
      <h2></h2>
      <div class="size"></div>
      <div class="price"></div>
      <div class="spec"></div>
      <div class="desc"></div>`;
    s.querySelector("h2").textContent = i.kode;
    s.querySelector(".size").textContent = i.ukuran ? "Ukuran plastik: " + i.ukuran : "";
    s.querySelector(".price").textContent = fmt(i.harga);
    s.querySelector(".spec").textContent = specLine(i);
    s.querySelector(".desc").textContent = i.deskripsi || "";
    track.appendChild(s);
  });
}

function slideIndex() {
  const w = track.clientWidth || 1;
  return Math.min(deck.length - 1, Math.max(0, Math.round(track.scrollLeft / w)));
}

function updateInfo() {
  const k = slideIndex();
  const i = deck[k];
  if (!i) return;
  counter.textContent = `${k + 1} / ${deck.length}`;
  const msg = `Halo admin Diyanda Gallery, saya mau tanya produk ${i.kode} (harga ${fmt(i.harga)}). Apakah masih tersedia?`;
  wa.href = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
  wa.textContent = `Tanya ${i.kode} via WhatsApp`;
  document.getElementById("prev").disabled = k === 0;
  document.getElementById("next").disabled = k === deck.length - 1;
}

function openModal(idx) {
  deck = current.filter(x => x.brand === current[idx].brand);
  const pos = deck.indexOf(current[idx]);
  buildSlides();
  modal.hidden = false;
  requestAnimationFrame(() => {
    track.scrollLeft = pos * track.clientWidth;
    updateInfo();
  });
}

let scrollTimer;
track.addEventListener("scroll", () => {
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(updateInfo, 80);
}, { passive: true });

function step(d) { track.scrollBy({ left: d * track.clientWidth, behavior: "smooth" }); }
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("close").onclick = () => modal.hidden = true;
modal.addEventListener("click", e => { if (e.target === modal) modal.hidden = true; });
document.addEventListener("keydown", e => {
  if (modal.hidden) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
  if (e.key === "Escape") modal.hidden = true;
});

loadData().then(() => { buildChips(); render(); });
</script>
